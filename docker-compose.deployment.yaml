# docker-compose.deployment.yaml — production stack (Dockge on the pi).
# Images are pulled from the private registry; all credentials and image
# tags come from a sibling .env file (see .env.example).

services:
  postgres:
    image: pgvector/pgvector:pg14
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-konakore}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secret}
      - POSTGRES_DB=${POSTGRES_DB:-konakore}
      - TZ=UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konakore -d konakore"]
      interval: 30s
      timeout: 10s
      retries: 5

  api:
    image: ${REGISTRY_URL:-192.168.0.110:5000}/my-konakore-api:${API_TAG:-latest}
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3001:3000'
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-konakore}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secret}
      - POSTGRES_DB=${POSTGRES_DB:-konakore}
      - FILE_SYNC_URL=http://worker:8090
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - TZ=UTC

  worker:
    image: ${REGISTRY_URL:-192.168.0.110:5000}/my-konakore-worker:${WORKER_TAG:-latest}
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '8090:8090'
    volumes:
      - /mnt/hd1/Wallpaper:/wallpaper
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-konakore}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secret}
      - POSTGRES_DB=${POSTGRES_DB:-konakore}
      - WORKER_HTTP_ADDR=:8090
      - ARIA2_URL=${ARIA2_URL:-ws://192.168.0.110:6800/jsonrpc}
      - ARIA2_SECRET=${ARIA2_SECRET:-}
      - DOWNLOAD_BASE_PATH=/wallpaper
      # konachan.com explicit/questionable backfill (Cloudflare + moebooru auth)
      - KONACHAN_LOGIN=${KONACHAN_LOGIN:-}
      - KONACHAN_PASSWORD=${KONACHAN_PASSWORD:-}
      - KONACHAN_PASSWORD_HASH=${KONACHAN_PASSWORD_HASH:-}
      - KONACHAN_CF_CLEARANCE=${KONACHAN_CF_CLEARANCE:-}
      - KONACHAN_USER_AGENT=${KONACHAN_USER_AGENT:-}
      - RANGE_BACKFILL_INTERVAL=${RANGE_BACKFILL_INTERVAL:-48m}
      - RANGE_BACKFILL_TAIL_INTERVAL=${RANGE_BACKFILL_TAIL_INTERVAL:-48m}
      - RANGE_BACKFILL_START_ID=${RANGE_BACKFILL_START_ID:-404000}
      - RANGE_BACKFILL_WINDOW=${RANGE_BACKFILL_WINDOW:-100}
      - ALERTCENTER_URL=${ALERTCENTER_URL:-http://alertcenter:8088}
      - TZ=UTC

  frontend:
    image: ${REGISTRY_URL:-192.168.0.110:5000}/my-konakore-frontend:${FRONTEND_TAG:-latest}
    restart: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '5173:5173'
    volumes:
      - nginx_cache:/var/cache/nginx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    external: true
    name: konakore-postgres_postgres_data
  nginx_cache:

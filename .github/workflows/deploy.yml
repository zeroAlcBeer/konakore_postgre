# Builds changed components natively on the Pi (arm64), publishes immutable
# git-SHA tags to the LAN registry via `make release-<component>`, pins them
# in the stack's .env, and rolls the Dockge stack.
#
# SECURITY NOTE (public repo): this workflow must never gain a pull_request
# trigger — it executes on the Pi, and only the repo owner can push master.
name: Deploy

on:
  push:
    branches: [master]
    paths:
      - "api/**"
      - "worker/**"
      - "frontend/**"
      - "Makefile"
      - "docker-compose.deployment.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      components:
        description: "Comma-separated components to force-release (api,worker,frontend)"
        required: false
        default: ""

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api == 'true' || contains(github.event.inputs.components, 'api') }}
      worker: ${{ steps.filter.outputs.worker == 'true' || contains(github.event.inputs.components, 'worker') }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' || contains(github.event.inputs.components, 'frontend') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            api:
              - "api/**"
            worker:
              - "worker/**"
            frontend:
              - "frontend/**"

  deploy:
    needs: changes
    runs-on: [self-hosted, pi]
    env:
      STACK_DIR: /opt/stacks/konakore_postgre
    steps:
      - uses: actions/checkout@v4

      - name: Release changed components (native arm64 build)
        run: |
          set -eu
          if [ "${{ needs.changes.outputs.api }}" = "true" ]; then make release-api; fi
          if [ "${{ needs.changes.outputs.worker }}" = "true" ]; then make release-worker; fi
          if [ "${{ needs.changes.outputs.frontend }}" = "true" ]; then make release-frontend; fi

      - name: Pin released tags in the stack .env
        run: |
          set -eu
          SHA=$(git rev-parse --short=12 HEAD)
          if [ "${{ needs.changes.outputs.api }}" = "true" ]; then
            sudo sed -i "s/^API_TAG=.*/API_TAG=$SHA/" "$STACK_DIR/.env"
          fi
          if [ "${{ needs.changes.outputs.worker }}" = "true" ]; then
            sudo sed -i "s/^WORKER_TAG=.*/WORKER_TAG=$SHA/" "$STACK_DIR/.env"
          fi
          if [ "${{ needs.changes.outputs.frontend }}" = "true" ]; then
            sudo sed -i "s/^FRONTEND_TAG=.*/FRONTEND_TAG=$SHA/" "$STACK_DIR/.env"
          fi

      - name: Sync deployment compose to the stack
        run: |
          sudo cp docker-compose.deployment.yaml "$STACK_DIR/compose.yaml"
          cd "$STACK_DIR" && sudo docker compose config --quiet

      - name: Roll the stack
        run: |
          cd "$STACK_DIR"
          # Scoped pull: never touch the floating postgres tag here, so an
          # upstream pg14 rebuild can't restart the DB on an unrelated deploy.
          sudo docker compose pull api worker frontend
          sudo docker compose up -d

      - name: Verify health
        run: |
          for i in $(seq 1 18); do
            api=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3001/ || true)
            fe=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5173/ || true)
            wk=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8090/health || true)
            # The full nginx→api proxy chain, not just the static page: a
            # stale upstream DNS entry once served 502s while / stayed 200.
            chain=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:5173/api/v1/posts?limit=1" || true)
            if [ "$api" = "200" ] && [ "$fe" = "200" ] && [ "$wk" = "200" ] && [ "$chain" = "200" ]; then
              echo "healthy after $((i*5))s"
              exit 0
            fi
            sleep 5
          done
          echo "stack never became healthy (api=$api frontend=$fe worker=$wk chain=$chain)"
          exit 1

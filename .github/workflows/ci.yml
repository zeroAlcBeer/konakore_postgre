# PR checks + master push checks. GitHub-hosted runners only — free for a
# public repo, and no secrets are exposed to fork PRs.
#
# frontend lint is NOT gated yet: 19 pre-existing no-unused-vars errors.
# Add `npm run lint` here once that debt is cleared.
name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: worker/go.mod
      - run: go build ./...
        working-directory: worker
      - run: go vet ./...
        working-directory: worker

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install deps and import-check the app
        working-directory: api
        run: |
          uv venv
          uv pip install -r pyproject.toml
          .venv/bin/python -c "import api"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

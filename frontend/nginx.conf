# Disk cache for proxied konachan images (immutable content, so 30d is safe).
# Lives in a compose volume so redeploys don't nuke a warm cache.
proxy_cache_path /var/cache/nginx/konachan levels=1:2 keys_zone=konachan:10m
                 max_size=2g inactive=30d use_temp_path=off;

server {
    listen 5173;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 1000;

    # Resolve upstreams through Docker's embedded DNS at request time.
    # A plain hostname in proxy_pass is resolved once at nginx startup and
    # cached forever, so a recreated api container with a new IP turns
    # every proxied request into a 502 until this container restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API proxy → backend
    location /api/ {
        set $api_upstream api:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Konachan image proxy with disk cache.
    # The default cache key includes the query string, which keeps the
    # frontend's cache-busting connectivity probe (favicon.ico?t=...) honest.
    location /konachan-proxy/ {
        set $konachan_upstream konachan.net;
        rewrite ^/konachan-proxy/(.*)$ /$1 break;
        proxy_pass https://$konachan_upstream;
        proxy_set_header Referer https://konachan.net;
        proxy_ssl_server_name on;

        proxy_cache konachan;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Static assets with cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
